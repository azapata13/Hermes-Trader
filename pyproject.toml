[project]
name = "hermes-trading"
version = "0.9.0+c9"      # runtime version string: hermes.__version__ = "0.9.0-c9"
description = "Hermès — MNQ order-flow trading assistant (Phase C: market intelligence + HUMAN_APPROVAL proposals, read-only, no orders)"
requires-python = ">=3.11"
# Runtime dependency NOT resolvable from PyPI:
#   ibapi == 10.45.1, installed from the official TWS API distribution
#   (the PyPI package named "ibapi" is an unrelated, outdated upload — never pip install it).
dependencies = ["msgpack==1.2.2", "tzdata==2026.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]
slack = ["slack-bolt==1.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: requires a running TWS (never run in CI; run with -m live and HERMES_LIVE=1)",
]

# Lint policy (explicit, so every machine runs the same rules: without this section Ruff silently
# falls back to whatever configuration it finds outside the repository). Pin: requirements-dev.txt.
[tool.ruff]
# Refuse to run with any other Ruff version: rule sets and defaults change between versions.
required-version = "==0.15.11"
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "BLE", "RUF"]
# noqa codes for rule families not enabled here are kept on purpose (ibapi camelCase callbacks, etc.)
external = ["N", "A", "TRY"]
ignore = [
    "UP042",   # (str, Enum) -> StrEnum changes str()/format() of members: behavioral
    "RUF001",  # intentional typography (—, ×, ≥, accents) in operator and Slack text
    "RUF002",
    "RUF003",
    "RUF005",  # concatenation kept: unpacking changes the result type for non-list/tuple operands
    "RUF015",  # next(iter(x)) raises StopIteration instead of IndexError: behavioral
    "RUF023",  # __slots__ listed in documentation order
    "B905",    # adding zip(strict=...) to replay/storage code is not a lint-only change
]

# Production code under hermes/ is deliberately left byte-for-byte unchanged by the lint cleanup:
# the replay code fingerprints hash these sources (market: hermes/replay/fingerprint.py _CODE_FILES;
# decision: hermes/decision/*.py + hermes/config.py), so even an import reorder would turn every
# recorded session into "different code — NO equivalence claim". The remaining historical findings
# are exempted per file, per rule. All of them are cosmetic (import style/order, quoted annotations
# under `from __future__ import annotations`, a redundant noqa); none hides a behavioral issue.
[tool.ruff.lint.per-file-ignores]
# --- replay fingerprint: decision code (hermes/decision/*.py + hermes/config.py)
"hermes/config.py" = ["UP035"]                 # typing.Mapping import
"hermes/decision/candidate.py" = ["I001"]      # import block order
"hermes/decision/runtime.py" = ["UP037"]       # quoted return annotation
# --- replay fingerprint: market code (_CODE_FILES)
"hermes/ibkr/normalizer.py" = ["UP035"]        # typing.Callable import
"hermes/ibkr/contracts.py" = ["UP037"]         # quoted return annotation
"hermes/market/pricegrid.py" = ["UP035", "UP037"]
"hermes/market/patterns.py" = ["I001"]
"hermes/market/snapshot.py" = ["I001"]
"hermes/market/tape.py" = ["UP037"]
# --- not fingerprinted, but safety-critical (TWS read-only guard, connection pipeline, replay and
#     recording read path, Slack): kept unchanged on purpose for the live validation
"hermes/ibkr/readonly.py" = ["UP035"]          # typing.Callable import (order-blocking guard: untouched)
"hermes/ibkr/gateway.py" = ["UP035"]
"hermes/ibkr/adapter.py" = ["RUF100"]          # explanatory BLE001 noqa on fail-safe excepts kept
"hermes/replay/decisions.py" = ["UP037"]
"hermes/replay/source.py" = ["UP035"]
"hermes/storage/codec.py" = ["UP035"]
"hermes/storage/reader.py" = ["UP035"]
"hermes/core/telemetry.py" = ["UP035", "RUF100"]
# chat.py: one best-effort Slack error notice (logged with traceback) lacks a noqa; the others have one
"hermes/slack/chat.py" = ["BLE001", "RUF100"]
